suite: basic auth
templates:
  - deployment.yaml
  - config-map.yaml
  - secret.yaml
tests:
  - it: enables basic auth by default
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "true"

  - it: disables basic auth when set to false
    template: deployment.yaml
    set:
      config.security.basicAuth.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "false"

  - it: disables basic auth when only OIDC is configured
    template: deployment.yaml
    set:
      config.security.oidc.issuerUri: https://issuer
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "false"

  - it: enables basic auth alongside OIDC when set to true
    template: deployment.yaml
    set:
      config.security.oidc.issuerUri: https://issuer
      config.security.basicAuth.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "true"

  - it: keeps basic auth disabled alongside OIDC when set to false
    template: deployment.yaml
    set:
      config.security.oidc.issuerUri: https://issuer
      config.security.basicAuth.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "false"

  - it: enables basic auth alongside OIDC when the deprecated username is set
    template: deployment.yaml
    set:
      config.security.oidc.issuerUri: https://issuer
      config.security.username: legacy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
            value: "true"

  - it: omits basic auth env vars when security is disabled
    template: deployment.yaml
    set:
      config.security.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_ENABLED
          any: true

  - it: references the chart Secret for the credentials by default
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: kannika-api
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kannika-api
                key: password

  - it: references a custom Secret name and keys
    template: deployment.yaml
    set:
      config.security.secret.name: my-secret
      config.security.secret.usernameKey: user
      config.security.secret.passwordKey: pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KANNIKA_SECURITY_BASIC_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: pass

  - it: creates the Secret with default credentials
    template: secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: kannika-api
      - equal:
          path: data.username
          value: a2FubmlrYQ==
      - equal:
          path: data.password
          value: a2FubmlrYQ==

  - it: creates the Secret from basicAuth credentials
    template: secret.yaml
    set:
      config.security.basicAuth.username: alice
      config.security.basicAuth.password: s3cret
    asserts:
      - equal:
          path: data.username
          value: YWxpY2U=
      - equal:
          path: data.password
          value: czNjcmV0

  - it: creates the Secret from deprecated credentials
    template: secret.yaml
    set:
      config.security.username: legacy
      config.security.password: legacy-pass
    asserts:
      - equal:
          path: data.username
          value: bGVnYWN5
      - equal:
          path: data.password
          value: bGVnYWN5LXBhc3M=

  - it: prefers deprecated credentials over basicAuth credentials
    template: secret.yaml
    set:
      config.security.username: legacy
      config.security.basicAuth.username: alice
    asserts:
      - equal:
          path: data.username
          value: bGVnYWN5

  - it: creates the Secret with a custom name and keys
    template: secret.yaml
    set:
      config.security.secret.name: my-secret
      config.security.secret.usernameKey: user
      config.security.secret.passwordKey: pass
    asserts:
      - equal:
          path: metadata.name
          value: my-secret
      - equal:
          path: data.user
          value: a2FubmlrYQ==
      - equal:
          path: data.pass
          value: a2FubmlrYQ==

  - it: does not create the Secret when secret creation is disabled
    template: secret.yaml
    set:
      config.security.secret.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the Secret when security is disabled
    template: secret.yaml
    set:
      config.security.enabled: false
    asserts:
      - hasDocuments:
          count: 0
