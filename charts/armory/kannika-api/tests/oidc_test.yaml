suite: oidc
templates:
  - config-map.yaml
tests:
  - it: omits OIDC settings by default
    asserts:
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_ISSUER_URI
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_AUDIENCE
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_PRINCIPAL_CLAIM_NAME

  - it: sets the issuer URI when configured
    set:
      config.security.oidc.issuerUri: https://issuer
    asserts:
      - equal:
          path: data.KANNIKA_SECURITY_OIDC_ISSUER_URI
          value: https://issuer
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_AUDIENCE
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_PRINCIPAL_CLAIM_NAME

  - it: sets the audience when configured
    set:
      config.security.oidc.issuerUri: https://issuer
      config.security.oidc.audience: kannika-armory
    asserts:
      - equal:
          path: data.KANNIKA_SECURITY_OIDC_AUDIENCE
          value: kannika-armory

  - it: sets the principal claim name when configured
    set:
      config.security.oidc.issuerUri: https://issuer
      config.security.oidc.principalClaimName: email
    asserts:
      - equal:
          path: data.KANNIKA_SECURITY_OIDC_PRINCIPAL_CLAIM_NAME
          value: email

  - it: omits OIDC settings when security is disabled
    set:
      config.security.enabled: false
      config.security.oidc.issuerUri: https://issuer
      config.security.oidc.audience: kannika-armory
      config.security.oidc.principalClaimName: email
    asserts:
      - equal:
          path: data.KANNIKA_SECURITY_ENABLED
          value: "false"
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_ISSUER_URI
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_AUDIENCE
      - isNull:
          path: data.KANNIKA_SECURITY_OIDC_PRINCIPAL_CLAIM_NAME
